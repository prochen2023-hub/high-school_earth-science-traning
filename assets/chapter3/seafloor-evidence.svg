</g>
<text x="31" y="720" font-size="16" fill="#9fc9e6" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif">課程用示意，非特定洋脊的實測磁異常資料；實際年齡、擴張速率與條帶寬度需由資料判讀。</text>
