<div class="pane-heading"><span class="chapter-no">01 / 05</span><div><h2>先看懂臺灣地質帶：為什麼岩石東西不同？</h2><p>與其一次背八個名詞，不如先抓住大方向：西部主要看到較年輕的沉積岩；往中央走，變質作用與構造變形更明顯；東部海岸山脈又有島弧火山岩的故事。</p></div></div>
<div class="comparison-key"><div>① <b>海岸平原</b>的地層鬆散、年輕</div><div>② <b>西部麓山</b>有砂頁岩、礫岩</div><div>③ <b>中央山脈</b>見板岩、片岩與大理岩</div><div>④ <b>海岸山脈</b>帶有島弧岩石印記</div></div>

<section class="tab-pane" data-pane="seafloor" id="seafloor">
<div class="pane-heading"><span class="chapter-no">02 / 05</span><div><h2>地圖往海上一推，海溝、海槽、海盆全都連起來</h2><p>臺灣不是孤立的高山島；北方連著琉球隱沒帶及沖繩海槽，南方與馬尼拉海溝、呂宋島弧相連，東側海水下還有很深的海盆與陡峭的海底坡地。</p></div></div>
<div class="atlas-layout"><div class="map-card bathy"><header><b>有經緯度的臺灣周圍海底地形總覽</b><button class="zoom" data-zoom="#seaMap" type="button">⛶ 放大看圖</button></header><img alt="臺灣與海峽、沖繩海槽、琉球海溝、馬尼拉海溝及花東海盆的地形底圖" id="seaMap" loading="lazy" src="assets/atlas/taiwan-seafloor.webp"/><p class="map-disclaimer">地形背景為 ETOPO1 概覽解析度；紅色虛線是教學位置提示，不是精密板塊界線或海底測線。</p></div>
<div class="atlas-detail"><h3>這些海底地形到底差在哪裡？</h3><div class="feature-list" id="seaBtns">
<button class="feature active" data-feature="trench">海溝 Trench</button><button class="feature" data-feature="trough">海槽 Trough</button>
<button class="feature" data-feature="basin">海盆 Basin</button><button class="feature" data-feature="arc">島弧 Island arc</button>
<button class="feature" data-feature="prism">增積岩體 Prism</button><button class="feature" data-feature="shelf">大陸棚 Shelf</button>
<button class="feature" data-feature="slope">大陸坡 Slope</button><button class="feature" data-feature="canyon">海底峽谷 Canyon</button>
<button class="feature" data-feature="ridge">中洋脊 Mid-ocean ridge</button><button class="feature" data-feature="forearc">弧前／弧後盆地</button>
</div><article aria-live="polite" class="detail-box" id="seaInfo"></article></div></div>
<div class="three-lessons"><article><b>北側關鍵</b><h3>琉球海溝 ≠ 沖繩海槽</h3><p>琉球海溝是隱沒帶的海溝；沖繩海槽位於琉球島弧後方，與張裂作用相關。兩者名稱接近，成因與構造位置不同。</p></article><article><b>南側關鍵</b><h3>馬尼拉海溝與呂宋島弧</h3><p>南方的歐亞板塊海洋岩石圈向東隱沒，海溝在隱沒起點附近；呂宋島弧位於其東方，是火山島弧系統的一部分。</p></article><article><b>臺灣本島</b><h3>為什麼東部海岸那麼陡？</h3><p>東臺灣靠近活動板塊邊界與深水盆地，岸外的海底坡度與臺灣西部淺海棚區明顯不同。</p></article></div>
<div class="source-strip"><b>延伸看專業海底地形：</b><a href="https://basin.earth.ncu.edu.tw/DataMap/Taiwan.htm" rel="noopener noreferrer" target="_blank">中央大學臺灣地質、海底地形與構造圖 ↗</a><a href="https://commons.wikimedia.org/wiki/File:Taiwan_tectonics.png" rel="noopener noreferrer" target="_blank">Wikimedia 具座標的地形構造圖 ↗</a></div>
</section>
<section class="tab-pane" data-pane="mechanism" id="mechanism">
<div class="pane-heading"><span class="chapter-no">03 / 05</span><div><h2>把整個隱沒帶切開：你看到的不只有「板塊往下鑽」</h2><p>從海洋往大陸看：海溝在前面，增積岩體像被推皺的地毯，板塊一路向下形成傾斜地震帶，部分熔融與岩漿上升才可能形成火山弧。</p></div></div>
<div class="cinema"><div class="cinema-photo"><img alt="以立體視覺呈現海溝、增積岩體、隱沒板塊、火山弧及震源帶的示意剖面" id="cinemaImg" src="assets/atlas/subduction-3d.webp"/><button class="zoom cinema-zoom" data-zoom="#cinemaImg">⛶ 放大圖</button></div><div class="cinema-caution"><b>重要科學說明：</b>此為藝術化剖面，以強烈的發光效果幫助辨認熱源及地震帶；地函大部分仍是固態，不能把橘色部分當成地下充滿液態岩漿，深度和地形比例也不是實測。</div></div>
<div class="mechanism-steps" id="mechanismSteps"><button class="step active" data-step="0"><b>01</b> 海洋岩石圈變冷變密</button><button class="step" data-step="1"><b>02</b> 海溝與增積岩體</button><button class="step" data-step="2"><b>03</b> 震源隨板塊變深</button><button class="step" data-step="3"><b>04</b> 流體促進局部熔融</button><button class="step" data-step="4"><b>05</b> 火山弧與造山</button></div>
<article aria-live="polite" class="spotlight" id="mechanismInfo"></article>
<div class="two-mechanisms"><article><span class="flag north">臺灣東北｜琉球系統</span><h3>菲律賓海板塊向北隱沒</h3><p>海溝位於臺灣東北外海，往北進入歐亞板塊一側之下，與琉球島弧、沖繩海槽構成相互關聯但不相同的構造單元。</p><div class="move-arrows"><span>菲律賓海板塊</span><b>↗ 向北隱沒</b><span>歐亞板塊側</span></div></article><article><span class="flag south">臺灣南方｜馬尼拉系統</span><h3>歐亞板塊的海洋岩石圈向東隱沒</h3><p>南海所在的歐亞板塊一側，向東隱沒到菲律賓海板塊的呂宋島弧之下；地表可見馬尼拉海溝與呂宋弧系統。</p><div class="move-arrows"><span>歐亞板塊（南海側）</span><b>↗ 向東隱沒</b><span>菲律賓海板塊側</span></div></article></div>
<div class="source-strip"><b>真正的臺灣立體構造專業圖：</b><a href="https://commons.wikimedia.org/wiki/File:Taiwan_tectonics_block_diagram.png" rel="noopener noreferrer" target="_blank">臺灣立體板塊模型・Mikenorton / CC BY-SA 4.0 ↗</a><span>與本站藝術化剖面對照，可以看見臺灣具有北南方向不同的隱沒系統。</span></div>
</section>
<section class="tab-pane" data-pane="specimens" id="specimens">
<div class="pane-heading"><span class="chapter-no">04 / 05</span><div><h2>真正的岩石標本：先看顆粒、片理、層理，再找臺灣產地</h2><p>這一區用你提供教材中的<strong>岩石實物照片局部裁切</strong>（不是 AI 畫的假石頭），分辨外觀後，再把「哪裡能看到這種岩石」連回臺灣地質區。</p></div></div>
<div class="sample-note">照片為<strong>岩石種類的實物標本示例</strong>，不是臺灣指定產地的現地採樣照片；「臺灣哪裡有」是另依區域地質資料標示，請勿誤以為每張標本照片都採自該地。</div>
<section class="rock-locality"><div class="rock-locality-art"><div class="rock-locality-head"><b>真實地理位置：岩石分布對照圖</b><button class="zoom" data-zoom="#localityMap">⛶ 放大</button></div><img alt="岩石在臺灣相關地質地點的位置，金門馬祖澎湖與本島均依真實海岸線定位" id="localityMap" loading="lazy" src="assets/atlas/rock-localities.webp"/></div><div class="locality-side"><h3>一邊認岩石，一邊找臺灣的位置</h3><p>標號是臺灣能找到相關岩石或典型地景的地區示例；照片本身不是這些地點的採集證明。</p><div class="locality-labels"><span>① 澎湖・玄武岩</span><span>② 金門・花崗質岩</span><span>③ 馬祖・花崗岩</span><span>④ 苗栗火炎山・礫岩</span><span>⑤ 野柳・砂岩</span><span>⑥ 大屯山・安山岩</span><span>⑦ 廬山・板岩</span><span>⑧ 太魯閣・片岩／大理岩</span><span>⑨ 海岸山脈・島弧火山岩</span><span>⑩ 龜山島・火山岩</span></div><div class="locality-hint">觀念：<strong>西部沉積 → 中央變質 → 東部與北部火山</strong>；但地質帶並不是從西往東一條完全均質的彩色直線。</div></div></section>
<div class="rock-controls"><div class="filter-set" id="rockFilters"><button class="filter active" data-filter="all">全部標本</button><button class="filter" data-filter="igneous">火成岩</button><button class="filter" data-filter="sedimentary">沉積岩</button><button class="filter" data-filter="metamorphic">變質岩</button></div><label>搜尋岩石或地點 <input autocomplete="off" id="rockSearch" placeholder="例如：太魯閣、玄武岩、砂岩…"/></label></div>
